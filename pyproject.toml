[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biom-kit"
version = "0.1.0"
description = "Intuitive Python client and data science toolkit for the BIOM platform"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = [
    "requests>=2.28.0",
    "pandas>=1.5.0",
    "matplotlib>=3.6.0",
    "seaborn>=0.12.0",
    "tabulate>=0.9.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "responses>=0.23.0"
]
plotly = [
    "plotly>=5.14.0"
]

[tool.hatch.build.targets.wheel]
packages = ["src/biom"]
